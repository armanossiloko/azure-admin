<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var k = 'azure-admin-theme';
        if (localStorage.getItem(k) === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
      } catch (_) {}
    })();
  </script>
  <title>Azure Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Release control for Azure DevOps — teams, repositories, and promotion pull requests in one place.">
  <meta name="theme-color" content="#2B63E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)">
  <meta name="application-name" content="Azure Admin">
  <meta name="apple-mobile-web-app-title" content="Azure Admin">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
