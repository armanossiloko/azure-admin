services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: azureadmin
      POSTGRES_PASSWORD: azureadmin
      POSTGRES_DB: azureadmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azureadmin -d azureadmin"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend/AzureAdmin.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=azureadmin;Username=azureadmin;Password=azureadmin
      AzureDevOps__ApiVersion: "7.1"
    ports:
      - "5063:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
